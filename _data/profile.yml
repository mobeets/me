intro: "Hi! I am a neuroscientist interested in how populations of neurons change their activity during learning, a topic I approach using techniques from statistics and machine learning.</p><p>I am currently an assistant professor in the Department of Neuroscience at Baylor College of Medicine. Before that, I was a postdoc at Harvard University with <a href=\"https://gershmanlab.com/\">Sam Gershman</a>, where I studied the neural representations of reinforcement learning. I got my Ph.D. in neural computation and machine learning at Carnegie Mellon University, where I studied learning using brain-computer interfaces with <a href=\"https://users.ece.cmu.edu/~byronyu/\">Byron Yu</a>, <a href=\"https://chaselab.github.io/\">Steve Chase</a>, and <a href=\"https://smile.pitt.edu/\">Aaron Batista</a>."
